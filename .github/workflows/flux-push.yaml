name: Push releases as OCI artifact

on:
  push:
    tags:
      - 'v*'

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keep main and each feature branch in a separate OCI repository so a
      # cluster bootstrapped from one branch cannot consume another branch's
      # release stream.
      - name: Resolve artifact repository
        id: repo
        run: |
          if git branch -r --contains "${GITHUB_SHA}" | grep -qE '^[[:space:]]*origin/main$'; then
            branch=main
          else
            branch=$(git branch -r --contains "${GITHUB_SHA}" \
              --format='%(refname:lstrip=3)' | grep -v '^HEAD' | head -1)
          fi
          if [ "${branch}" = "main" ]; then
            repo=releases
          else
            repo="releases-$(printf '%s' "${branch}" \
              | sed 's|^.*/||; s|[^A-Za-z0-9._-]|-|g' | tr '[:upper:]' '[:lower:]')"
          fi
          echo "name=${repo}" >> "$GITHUB_OUTPUT"
          echo "${GITHUB_REF_NAME} is on '${branch}' -> ${repo}"

      - name: Push OCI artifact
        id: push
        run: |
          TAG=${GITHUB_REF_NAME#v}
          digest=$(flux push artifact "oci://ghcr.io/${GITHUB_REPOSITORY}/${{ steps.repo.outputs.name }}:${TAG}" \
            --path=./abox-llmd-embeddings/releases \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}" \
            --output json | jq -r '.digest')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Tag artifact
        run: |
          flux tag artifact \
            "oci://ghcr.io/${GITHUB_REPOSITORY}/${{ steps.repo.outputs.name }}:${{ steps.push.outputs.tag }}@${{ steps.push.outputs.digest }}" \
            --tag latest
